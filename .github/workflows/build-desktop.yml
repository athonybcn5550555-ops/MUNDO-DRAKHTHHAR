name: Build desktop installers (Fee & Price Calculator)

on:
  push:
    branches: [claude/tienda-etsy-v49wjl, master]
    paths:
      - 'productos/etsy-fee-calculator/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: productos/etsy-fee-calculator/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: productos/etsy-fee-calculator/desktop/src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: productos/etsy-fee-calculator/desktop
          args: ${{ matrix.args }}
          tagName: calculator-v__VERSION__
          releaseName: Fee & Price Calculator v__VERSION__
          releaseBody: |
            Instaladores de la calculadora de comisiones y precios.

            - Windows 10/11: descarga el archivo `.exe`.
            - macOS 10.15 o superior: descarga el archivo `.dmg` (Intel y Apple Silicon).

            Los instaladores no están firmados todavía. En Windows aparecerá el aviso
            de SmartScreen: pulsa "Más información" y luego "Ejecutar de todas formas".
            En macOS, la primera vez ábrelo con clic derecho y "Abrir".
          releaseDraft: false
          prerelease: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            productos/etsy-fee-calculator/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            productos/etsy-fee-calculator/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
