<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Fee & Price Calculator</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#1c1f2a;--muted:#5d6272;--line:#dfe2ea;--accent:#5b3df5;--accent2:#12b5a5;--ok:#1a9e5c;--warn:#d98a00;--bad:#d7263d;--okbg:#e6f7ee;--warnbg:#fff4e0;--badbg:#fde8ec;--r:12px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:linear-gradient(120deg,#1b1340,#3a1f7a 55%,#0f6f78);color:#fff;padding:18px 20px}
.wrap{max-width:1100px;margin:0 auto}
header .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:22px;letter-spacing:.2px}
header p{margin:4px 0 0;opacity:.85;font-size:13px}
header select{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
header select option{color:#1c1f2a}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button,.btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
main button{border-color:var(--line);background:#fff;color:var(--ink)}
main button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main button.danger{color:var(--bad)}
main button:hover{filter:brightness(.96)}
main{padding:16px 20px 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 16px}
section h2{margin:0 0 4px;font-size:17px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input[type=text],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input[inputmode=decimal]{text-align:right;font-variant-numeric:tabular-nums}
input.bad{border-color:var(--bad);background:var(--badbg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.inline{display:flex;align-items:center;gap:8px}
.inline input[type=checkbox]{width:18px;height:18px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#eef;color:#3b2fa0;margin-left:6px;vertical-align:middle}
.tag.warn{background:var(--warnbg);color:#8a5a00}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap}
td input[inputmode=decimal]{padding:5px 6px;width:84px;min-width:84px}
.tablewrap{overflow-x:auto}
.tablewrap table{min-width:640px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.product{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:#fbfbfd;display:flex;flex-direction:column;gap:10px}
.product .top{display:flex;gap:8px;align-items:center}
.product .top input[type=text]{flex:1;font-weight:600}
.product .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.product.digital .fields [data-phys]{display:none}
.product .digi{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.product .digi input{width:16px;height:16px}
.result{display:flex;justify-content:space-between;align-items:center;border-radius:10px;padding:10px 12px;font-weight:600}
.result.ok{background:var(--okbg);color:var(--ok)}
.result.warn{background:var(--warnbg);color:#8a5a00}
.result.bad{background:var(--badbg);color:var(--bad)}
.result small{font-weight:400;color:var(--muted);display:block;font-size:12px}
details summary{cursor:pointer;font-size:13px;color:var(--accent)}
.breakdown{font-size:13px;margin-top:6px}
.breakdown div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed var(--line)}
.breakdown div.total{font-weight:600;border-bottom:none}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{padding:6px 10px;font-size:12px}
.big{font-size:26px;font-weight:700;color:var(--accent)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi div{background:#f6f5ff;border-radius:10px;padding:12px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;background:rgba(15,12,40,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
.overlay .box{background:#fff;color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:20px 22px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;margin:auto}
/* El manual es un panel acoplado: no tapa la aplicación y se puede minimizar. */
#manual[hidden]{display:none}
#manual{position:fixed;top:14px;right:14px;bottom:14px;width:min(430px,42vw);z-index:40;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 40px rgba(20,15,60,.22);display:flex;flex-direction:column;overflow:hidden}
#manual.min{top:auto;height:auto;bottom:14px;width:min(430px,90vw)}
#manual.min .manbody{display:none}
#manual.min .manhead{border-bottom:none}
#manual button{border-color:var(--line);background:#fff;color:var(--ink)}
#manual button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#manual button:hover{filter:brightness(.96)}
.manhead{display:flex;align-items:center;gap:8px;padding:11px 12px 11px 15px;border-bottom:1px solid var(--line);flex:none}
.manhead h2{margin:0;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.manactions{display:flex;gap:5px;flex:none}
.manactions button{padding:5px 9px;font-size:12px}
.iconbtn{width:28px;height:28px;padding:0!important;font-size:15px!important;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.manbody{overflow:auto;padding:2px 15px 16px;flex:1}
.mannow{font-size:11.5px;color:var(--muted);padding:0 15px 10px;display:none}
#manual.min .mannow.on{display:block}
@media (max-width:760px){ #manual{left:10px;right:10px;top:10px;bottom:10px;width:auto}
  #manual.min{top:auto;left:10px;right:10px;width:auto} }
@media print{ #manual{display:none!important} }
.msec{padding:14px 0;border-bottom:1px solid var(--line)}
.msec:last-child{border-bottom:none}
.msec h3{margin:0 0 6px;font-size:14px;color:#2a1f6b;display:flex;align-items:center;gap:8px}
.msec h3 .idx{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;flex:none}
.msec p{margin:0 0 7px;font-size:13.5px;line-height:1.55;border-radius:6px;padding:2px 5px;margin-left:-5px}
.msec p.reading{background:#efe9ff;box-shadow:0 0 0 2px #d8ccff}
.msec p{scroll-margin:60px}
.msec h3.reading .lbl{background:#efe9ff;border-radius:6px;padding:1px 5px}
.spk{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:999px;padding:2px 9px;font-size:11px;cursor:pointer;margin-left:auto;flex:none}
.overlay .box button{border-color:var(--line);background:#fff;color:var(--ink)}
.overlay .box button.spk{border-color:var(--line);background:#fff;color:var(--accent)}
.overlay .box button.primary{background:var(--accent);border-color:var(--accent);color:#fff;padding:10px 18px;font-size:14px}
.overlay ol{padding-left:20px}
.overlay li{margin-bottom:8px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:10px 20px 30px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c1f2a;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:560px){main{padding:12px}section{padding:12px}header h1{font-size:19px}}
@media print{header .bar,header select,main button,.actions,footer,#guide,.toast{display:none!important}body{background:#fff}section{break-inside:avoid;border:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="row">
      <div><h1 data-i="title">Fee &amp; Price Calculator</h1><p data-i="tagline"></p></div>
      <select id="lang" aria-label="Language">
        <option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option>
      </select>
    </div>
    <div class="bar">
      <button id="btnGuide" data-i="bGuide"></button>
      <button id="btnManual" data-i="bManual"></button>
      <button id="btnExport" data-i="bExport"></button>
      <button id="btnImport" data-i="bImport"></button>
      <button id="btnCsv" data-i="bCsv"></button>
      <button id="btnXlsx" data-i="bXlsx"></button>
      <button id="btnPrint" data-i="bPrint"></button>
    </div>
  </div>
</header>

<main class="wrap">

<section id="shop">
  <h2 data-i="s1"></h2>
  <p class="hint" data-i="s1hint"></p>
  <div class="grid">
    <div><label data-i="lCountry"></label><select id="country"></select></div>
    <div><label data-i="lCur"></label><input type="text" id="cur" maxlength="4"></div>
    <div><label data-i="lDate"></label><input type="text" id="feeDate" placeholder="YYYY-MM-DD"></div>
    <div><label data-i="lHourly"></label><input type="text" inputmode="decimal" id="hourly"></div>
  </div>
  <div class="tablewrap" style="margin-top:12px">
  <table>
    <thead><tr><th data-i="thFee"></th><th class="num">%</th><th class="num" data-i="thFixed"></th><th data-i="thApplies"></th></tr></thead>
    <tbody>
      <tr><td><span data-i="fListing"></span> <span class="tag" data-i="fListingTag"></span></td><td class="num">–</td><td class="num"><input type="text" inputmode="decimal" id="f_listing"></td><td data-i="fListingA"></td></tr>
      <tr><td data-i="fTrans"></td><td class="num"><input type="text" inputmode="decimal" id="f_trans"></td><td class="num">–</td><td data-i="fTransA"></td></tr>
      <tr><td data-i="fProc"></td><td class="num"><input type="text" inputmode="decimal" id="f_proc"></td><td class="num"><input type="text" inputmode="decimal" id="f_procfix"></td><td data-i="fProcA"></td></tr>
      <tr><td><span data-i="fReg"></span> <span class="tag" id="regTag"></span></td><td class="num"><input type="text" inputmode="decimal" id="f_reg"></td><td class="num">–</td><td data-i="fRegA"></td></tr>
      <tr><td data-i="fConv"></td><td class="num"><input type="text" inputmode="decimal" id="f_conv"></td><td class="num">–</td><td data-i="fConvA"></td></tr>
    </tbody>
  </table>
  </div>
  <div class="grid" style="margin-top:14px">
    <div>
      <label data-i="lOffsite"></label>
      <select id="offsite">
        <option value="none" data-i="oNone"></option>
        <option value="15" data-i="o15"></option>
        <option value="12" data-i="o12"></option>
      </select>
    </div>
    <div><label data-i="lCap"></label><input type="text" inputmode="decimal" id="f_offcap"></div>
    <div><label data-i="lEtsyAds"></label><input type="text" inputmode="decimal" id="f_etsyads"></div>
    <div>
      <label data-i="lVat"></label>
      <div class="inline"><input type="checkbox" id="vatOn"><input type="text" inputmode="decimal" id="f_vat" style="max-width:90px"><span style="font-size:12px;color:var(--muted)">%</span></div>
    </div>
    <div class="inline" style="align-self:end"><input type="checkbox" id="convOn"><label style="margin:0" for="convOn" data-i="lConvOn"></label></div>
  </div>
  <p class="hint" style="margin-top:10px" data-i="s1note"></p>
</section>

<section id="products">
  <h2 data-i="s2"></h2>
  <p class="hint" data-i="s2hint"></p>
  <div class="cards" id="cards"></div>
  <div class="actions" style="margin-top:12px"><button class="primary" id="btnAdd" data-i="bAdd"></button></div>
</section>

<section id="reverse">
  <h2 data-i="s3"></h2>
  <p class="hint" data-i="s3hint"></p>
  <div class="grid">
    <div><label data-i="lProduct"></label><select id="rvProduct"></select></div>
    <div><label data-i="lTarget"></label><select id="rvMode"><option value="amount" data-i="mAmount"></option><option value="margin" data-i="mMargin"></option></select></div>
    <div><label data-i="lTargetV"></label><input type="text" inputmode="decimal" id="rvTarget" value="10"></div>
    <div><label data-i="lGoal"></label><input type="text" inputmode="decimal" id="rvGoal" value="500"></div>
  </div>
  <div class="kpi" style="margin-top:14px">
    <div><span data-i="kPrice"></span><b class="big" id="rvPrice">–</b></div>
    <div><span data-i="kProfit"></span><b class="big" id="rvProfit">–</b></div>
    <div><span data-i="kMargin"></span><b class="big" id="rvMargin">–</b></div>
    <div><span data-i="kSales"></span><b class="big" id="rvSales">–</b></div>
  </div>
  <p class="hint" id="rvNote" style="margin-top:10px"></p>
</section>

</main>

<footer data-i="footer"></footer>

<div class="overlay" id="guide" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="guideTitle">
    <h2 style="margin-top:0" id="guideTitle" data-i="gTitle"></h2>
    <ol><li data-i="g1"></li><li data-i="g2"></li><li data-i="g3"></li></ol>
    <p style="font-size:13px;color:var(--muted)" data-i="gNote"></p>
    <div class="actions"><button class="primary" id="btnGuideClose" data-i="gStart"></button><button id="btnListen" data-i="bListen"></button></div>
  </div>
</div>
<aside id="manual" hidden role="region" aria-labelledby="manTitle">
  <div class="manhead">
    <h2 id="manTitle" data-i="mTitle"></h2>
    <div class="manactions">
      <button class="primary" id="btnManListen" data-i="mListenShort"></button>
      <button id="btnManPause" class="iconbtn" hidden aria-label="" title="">⏸</button>
      <button id="btnManStop" class="iconbtn" hidden aria-label="" title="">⏹</button>
      <button id="btnManMin" class="iconbtn" aria-label="" title="">–</button>
      <button id="btnManClose" class="iconbtn" aria-label="" title="">✕</button>
    </div>
  </div>
  <p class="mannow" id="manNow"></p>
  <div class="manbody" id="manBody"></div>
</aside>
<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept="application/json" hidden>

const MANUAL={"en": [["What this app does", ["It calculates what Etsy really takes from every sale, what you are left with, and what you should charge to earn what you want. It is one file that runs in your browser, with no account, no subscription and no internet connection.", "It is not connected to your Etsy shop. You type your prices and costs; the app does the arithmetic with the fee rates you confirm. That is deliberate: nothing you enter ever leaves your computer.", "Everything is saved automatically in this browser. If you clear your browser data or move to another computer, use Export backup and Import backup."]], ["Setting up your shop", ["Open section 1 and choose your seller country. That loads a fee profile: currency symbol, listing fee, transaction percentage, payment processing and, where it applies, the regulatory operating fee.", "Next to the regulatory fee you will see a small label. Verified with a date means those numbers were checked against Etsy's own help pages on that date. Check in Shop Manager means the profile is a reasonable starting point but you should confirm it yourself.", "Every fee is an editable box. If Etsy changes a rate, or your account differs, type the new number and update the date field. The app never overrides what you type.", "Set your hourly rate to whatever your time is worth. It is used to turn the hours you enter on each product into a real cost. If you would rather ignore labour, leave it at zero."]], ["Understanding each fee", ["Listing fee. A fixed amount Etsy charges when you publish a listing, when it renews after four months, and again each time a multi-quantity listing sells. The app counts one per order.", "Transaction fee. A percentage of the price plus the shipping you charge plus gift wrapping. It is the largest single fee for most sellers.", "Payment processing. A percentage of the order total plus a fixed amount per order. Both parts change by country, which is why the profile matters.", "Regulatory operating fee. A percentage some countries pay on price plus shipping. It is not charged to sellers in the United States or Germany. It changed in June 2026 for several countries, so verify yours.", "Currency conversion. Two and a half percent, charged only when the currency of your listing is different from the currency of your payment account. Tick the box only if that is your case.", "Offsite Ads. When Etsy advertises your product outside Etsy and that advert produces the sale, Etsy charges a percentage of the whole order, shipping included. Fifteen percent if your shop made less than ten thousand dollars in the last year, twelve percent above that, where it also becomes compulsory. There is a cap per order. Because it applies to the whole order and not just the price, it cuts your margin more than the headline number suggests.", "Etsy Ads. These are the adverts inside Etsy and they are pay per click, so there is no single percentage. Divide what you spent in a month by the orders it produced and enter that average.", "VAT on fees. If you sell from the European Union or the United Kingdom and have not given Etsy a VAT number, Etsy adds VAT on top of its own fees. Tick the box and set your rate. This is not the VAT your buyer pays.", "Where to check all of them: Shop Manager, then Finances, then Fees. Etsy also emails sellers before a change takes effect."]], ["Adding your products", ["Section 2 holds one card per product. Add as many as you like; the app has been tested with a hundred and fifty without slowing down.", "Price you charge and Shipping you charge are what the buyer pays. Discount is not a field here: enter the price you actually sell at.", "Then come your costs. Materials or cost of goods. Hours of work, multiplied by your hourly rate. Packaging. The shipping you actually pay, which is often different from what you charge. Print on demand cost, for Printify, Printful or similar. And overhead per unit for tools, subscriptions and anything else you want spread across your sales.", "Tick Digital product and the shipping, packaging and print on demand fields disappear and count as zero. Use it for downloads, templates and files.", "The coloured band at the bottom of each card is the summary. Green means a margin of twenty five percent or more. Amber means between ten and twenty five. Red means below ten percent, or a loss. Open Fee and cost breakdown to see every line that produced the number.", "Your margin is profit divided by price. It is not the same as your mark-up, and it is what tells you whether a product is worth making."]], ["The price finder", ["Section 3 works backwards. Instead of asking what you earn at a price, it asks what price gives you the earnings you want.", "Choose a product, then a target. Profit per sale asks for an amount of money. Margin asks for a percentage of the price. Type the target and the app gives you the price you need, the profit at that price and the resulting margin.", "Monthly profit goal turns that into a plan: how many sales of this product you need each month to reach it.", "If the target cannot be reached, everything shows a dash and a message explains why. That usually means the costs of the product make it impossible at any sensible price.", "The note underneath compares the result with your current price and suggests the nearest price ending in nine, because that is what converts best in the United States market."]], ["Backups, exports and printing", ["Export backup saves everything, shop settings and products, into a small file. Keep it somewhere safe. Import backup restores it, on this computer or another one.", "Do it before clearing browser data, changing computer, changing browser, or reinstalling anything. The app stores its data inside the browser, and browsers do forget.", "Export CSV writes your product list to a spreadsheet file with price, revenue, fees, costs, profit and margin. The separator and decimal mark follow the language you have selected, so it opens correctly in Excel in your country.", "Print or PDF produces a clean printable page without buttons, useful for your accountant or for your own records."]], ["A worked example", ["Say you sell a handmade candle from Spain for twenty five euros with four euros of shipping charged, and the sale is organic rather than from Offsite Ads.", "Etsy takes: the listing fee of eighteen cents; the transaction fee of six point five percent on twenty nine euros, which is one euro eighty nine; payment processing of four percent plus thirty cents, which is one euro forty six; and the regulatory fee of nought point eight eight percent, twenty six cents. Fees total three euros seventy nine.", "Your costs are, say, six euros of wax and glass, half an hour of work at fifteen euros an hour which is seven euros fifty, one euro of packaging and three euros fifty of postage you actually pay. Costs total eighteen euros.", "You receive twenty nine minus three seventy nine, which is twenty five euros twenty one. Take away eighteen euros of costs and your profit is seven euros twenty one, a margin of twenty eight point eight percent. The card shows green.", "Now set Offsite Ads to fifteen percent. Etsy takes four euros thirty five more and your profit falls to two euros eighty six, a margin of eleven percent. The card turns amber. That is the difference a single setting makes, and why it is worth modelling."]], ["Questions and problems", ["The numbers do not match my Etsy statement. Check three things. First, that the fee rates in section 1 match your Shop Manager today. Second, that Offsite Ads is set the way that sale actually happened. Third, that VAT on fees matches whether you have given Etsy a VAT number.", "I typed a comma and it did something odd. The app accepts both a comma and a full stop as the decimal mark, and both European and English thousands separators. If a box turns red it means what you typed is not a number and it is being counted as zero.", "My data disappeared. The app stores data inside the browser. Private browsing, clearing site data, a different browser or a different computer all mean a fresh start. This is why Export backup exists.", "It looks wrong on my phone. The app works on a phone, but the fee table scrolls sideways inside its own frame. Turn the phone to landscape for that part.", "My browser offers to translate the page. Say no. The app already has its own five languages and an automatic translation would overwrite them.", "Something is broken. Message me through Etsy before leaving a review. Support and free minor updates are included for thirty days, and I answer within a day."]], ["Once a year, check these", ["Whether Etsy has changed any fee, and update the numbers and the date in section 1.", "Whether your shop has crossed ten thousand dollars in the last twelve months, because Offsite Ads then becomes compulsory at twelve percent.", "Whether your hourly rate still reflects what your time is worth.", "Whether your material costs have risen, because a product that was green a year ago may be amber today.", "And export a fresh backup while you are at it."]]], "es": [["Qué hace esta aplicación", ["Calcula lo que Etsy se lleva de verdad en cada venta, lo que te queda a ti, y qué precio deberías poner para ganar lo que quieres. Es un solo archivo que funciona en tu navegador, sin cuenta, sin suscripción y sin conexión a internet.", "No está conectada a tu tienda de Etsy. Tú escribes tus precios y tus costes; la aplicación hace las cuentas con las comisiones que tú confirmas. Es a propósito: nada de lo que escribes sale nunca de tu ordenador.", "Todo se guarda automáticamente en este navegador. Si borras los datos del navegador o cambias de ordenador, usa Exportar copia e Importar copia."]], ["Configurar tu tienda", ["Abre la sección 1 y elige tu país de vendedor. Eso carga un perfil de comisiones: símbolo de moneda, comisión de publicación, porcentaje de transacción, procesamiento del pago y, donde corresponda, la tasa operativa regulatoria.", "Junto a la tasa regulatoria verás una etiqueta pequeña. Verificado con una fecha significa que esos números se comprobaron en las páginas de ayuda de Etsy ese día. Comprobar en el Administrador significa que el perfil es un punto de partida razonable pero deberías confirmarlo tú.", "Todas las comisiones son casillas editables. Si Etsy cambia un porcentaje, o tu cuenta es distinta, escribe el número nuevo y actualiza la fecha. La aplicación nunca sobrescribe lo que tú escribes.", "Pon tu tarifa por hora en lo que valga tu tiempo. Sirve para convertir las horas que indiques en cada producto en un coste real. Si prefieres no contar la mano de obra, déjala en cero."]], ["Entender cada comisión", ["Comisión de publicación. Un importe fijo que Etsy cobra al publicar un anuncio, al renovarlo cada cuatro meses, y otra vez cada vez que se vende un anuncio con varias unidades. La aplicación cuenta una por pedido.", "Comisión de transacción. Un porcentaje sobre el precio más el envío que cobras más el envoltorio de regalo. Para la mayoría de vendedores es la comisión más grande.", "Procesamiento del pago. Un porcentaje del total del pedido más una cantidad fija por pedido. Las dos partes cambian según el país, y por eso importa el perfil.", "Tasa operativa regulatoria. Un porcentaje que pagan algunos países sobre precio más envío. No se cobra a vendedores de Estados Unidos ni de Alemania. Cambió en junio de 2026 para varios países, así que verifica el tuyo.", "Conversión de moneda. Un dos y medio por ciento, que se cobra solo cuando la moneda de tu anuncio es distinta de la de tu cuenta de cobro. Marca la casilla solo si es tu caso.", "Offsite Ads. Cuando Etsy anuncia tu producto fuera de Etsy y ese anuncio produce la venta, Etsy cobra un porcentaje del pedido entero, envío incluido. Un quince por ciento si tu tienda facturó menos de diez mil dólares el último año, y un doce por ciento por encima de esa cifra, donde además pasa a ser obligatorio. Hay un tope por pedido. Como se aplica al pedido entero y no solo al precio, recorta el margen más de lo que sugiere el porcentaje.", "Etsy Ads. Son los anuncios dentro de Etsy y funcionan por clic, así que no hay un porcentaje único. Divide lo que gastaste en un mes entre los pedidos que consiguió e introduce esa media.", "IVA sobre las comisiones. Si vendes desde la Unión Europea o el Reino Unido y no le has dado a Etsy un número de IVA, Etsy añade IVA sobre sus propias comisiones. Marca la casilla y pon tu tipo. Esto no es el IVA que paga tu comprador.", "Dónde comprobarlas todas: Administrador de tienda, luego Finanzas, luego Comisiones. Etsy también avisa por correo a los vendedores antes de que un cambio entre en vigor."]], ["Añadir tus productos", ["La sección 2 tiene una tarjeta por producto. Añade los que quieras; se ha probado con ciento cincuenta sin que se ralentice.", "Precio que cobras y Envío que cobras es lo que paga el comprador. Aquí no hay campo de descuento: pon el precio al que vendes de verdad.", "Después vienen tus costes. Materiales o coste del producto. Horas de trabajo, que se multiplican por tu tarifa por hora. Embalaje. El envío que pagas de verdad, que suele ser distinto del que cobras. Coste de impresión bajo demanda, para Printify, Printful o similares. Y gastos generales por unidad para herramientas, cuotas y todo lo que quieras repartir entre tus ventas.", "Marca Producto digital y los campos de envío, embalaje e impresión bajo demanda desaparecen y cuentan como cero. Úsalo para descargas, plantillas y archivos.", "La banda de color al pie de cada tarjeta es el resumen. Verde significa un margen del veinticinco por ciento o más. Ámbar, entre diez y veinticinco. Rojo, por debajo del diez por ciento o pérdida. Abre Desglose de comisiones y costes para ver cada línea que ha producido ese número.", "Tu margen es el beneficio dividido entre el precio. No es lo mismo que el margen sobre coste, y es lo que te dice si un producto merece la pena."]], ["El buscador de precio", ["La sección 3 funciona al revés. En vez de preguntar cuánto ganas a un precio, pregunta qué precio te da lo que quieres ganar.", "Elige un producto y un objetivo. Beneficio por venta pide una cantidad de dinero. Margen pide un porcentaje del precio. Escribe el objetivo y la aplicación te da el precio que necesitas, el beneficio a ese precio y el margen resultante.", "El objetivo de beneficio mensual lo convierte en un plan: cuántas ventas de ese producto necesitas al mes para alcanzarlo.", "Si el objetivo no se puede alcanzar, todo muestra un guion y un mensaje explica por qué. Suele significar que los costes del producto lo hacen imposible a cualquier precio razonable.", "La nota de debajo compara el resultado con tu precio actual y sugiere el precio más cercano terminado en nueve, porque es el que mejor convierte en el mercado estadounidense."]], ["Copias, exportaciones e impresión", ["Exportar copia guarda todo, los ajustes de la tienda y los productos, en un archivo pequeño. Guárdalo en sitio seguro. Importar copia lo restaura, en este ordenador o en otro.", "Hazlo antes de borrar datos del navegador, cambiar de ordenador, cambiar de navegador o reinstalar cualquier cosa. La aplicación guarda sus datos dentro del navegador, y los navegadores olvidan.", "Exportar CSV escribe tu lista de productos en un archivo de hoja de cálculo con precio, ingresos, comisiones, costes, beneficio y margen. El separador y el decimal siguen el idioma que tengas puesto, así que se abre bien en Excel en tu país.", "Imprimir o PDF genera una página limpia sin botones, útil para tu gestor o para tu propio archivo."]], ["Un ejemplo resuelto", ["Supón que vendes una vela artesanal desde España a veinticinco euros con cuatro euros de envío cobrado, y que la venta es orgánica y no viene de Offsite Ads.", "Etsy se lleva: la comisión de publicación de dieciocho céntimos; la de transacción, un seis coma cinco por ciento sobre veintinueve euros, que son un euro ochenta y nueve; el procesamiento del pago, un cuatro por ciento más treinta céntimos, que son un euro cuarenta y seis; y la tasa regulatoria del cero coma ochenta y ocho por ciento, veintiséis céntimos. En total, tres euros setenta y nueve de comisiones.", "Tus costes son, digamos, seis euros de cera y cristal, media hora de trabajo a quince euros la hora que son siete euros cincuenta, un euro de embalaje y tres euros cincuenta de franqueo que pagas de verdad. En total, dieciocho euros de costes.", "Recibes veintinueve menos tres setenta y nueve, es decir veinticinco euros veintiuno. Le quitas dieciocho euros de costes y tu beneficio es de siete euros veintiuno, un margen del veintiocho coma ocho por ciento. La tarjeta se muestra en verde.", "Ahora pon Offsite Ads al quince por ciento. Etsy se lleva cuatro euros treinta y cinco más y tu beneficio baja a dos euros ochenta y seis, un margen del once por ciento. La tarjeta se pone ámbar. Esa es la diferencia que provoca un solo ajuste, y por eso merece la pena simularlo."]], ["Preguntas y problemas", ["Los números no cuadran con mi extracto de Etsy. Comprueba tres cosas. Primera, que las comisiones de la sección 1 coincidan con tu Administrador de tienda hoy. Segunda, que Offsite Ads esté puesto como ocurrió esa venta en realidad. Tercera, que el IVA sobre comisiones se corresponda con si le has dado o no un número de IVA a Etsy.", "He escrito una coma y ha hecho algo raro. La aplicación acepta coma y punto como decimal, y separadores de miles europeos e ingleses. Si una casilla se pone roja significa que lo que has escrito no es un número y se está contando como cero.", "Han desaparecido mis datos. La aplicación guarda los datos dentro del navegador. La navegación privada, borrar los datos del sitio, otro navegador u otro ordenador significan empezar de cero. Para eso existe Exportar copia.", "Se ve mal en el móvil. La aplicación funciona en el móvil, pero la tabla de comisiones se desplaza en horizontal dentro de su propio marco. Gira el teléfono para esa parte.", "Mi navegador me ofrece traducir la página. Dile que no. La aplicación ya tiene sus cinco idiomas y una traducción automática los pisaría.", "Algo no funciona. Escríbeme por Etsy antes de dejar una reseña. El soporte y las actualizaciones menores están incluidos treinta días, y respondo en menos de un día."]], ["Una vez al año, revisa esto", ["Si Etsy ha cambiado alguna comisión, y actualiza los números y la fecha en la sección 1.", "Si tu tienda ha superado los diez mil dólares en los últimos doce meses, porque entonces Offsite Ads pasa a ser obligatorio al doce por ciento.", "Si tu tarifa por hora sigue reflejando lo que vale tu tiempo.", "Si han subido tus costes de materiales, porque un producto que hace un año estaba verde hoy puede estar en ámbar.", "Y aprovecha para exportar una copia de seguridad nueva."]]], "fr": [["Ce que fait cette application", ["Elle calcule ce qu'Etsy prélève réellement sur chaque vente, ce qu'il vous reste, et le prix à demander pour gagner ce que vous voulez. C'est un seul fichier qui fonctionne dans votre navigateur, sans compte, sans abonnement et sans connexion internet.", "Elle n'est pas connectée à votre boutique Etsy. Vous saisissez vos prix et vos coûts ; l'application fait les calculs avec les frais que vous confirmez. C'est volontaire : rien de ce que vous saisissez ne quitte votre ordinateur.", "Tout est enregistré automatiquement dans ce navigateur. Si vous effacez les données du navigateur ou changez d'ordinateur, utilisez Exporter une sauvegarde et Importer une sauvegarde."]], ["Configurer votre boutique", ["Ouvrez la section 1 et choisissez votre pays de vendeur. Cela charge un profil de frais : symbole de devise, frais de mise en vente, pourcentage de transaction, traitement du paiement et, le cas échéant, les frais d'exploitation réglementaires.", "À côté des frais réglementaires figure une petite étiquette. Vérifié avec une date signifie que ces chiffres ont été contrôlés sur les pages d'aide d'Etsy ce jour-là. À vérifier dans le Gestionnaire signifie que le profil est un point de départ raisonnable mais que vous devez le confirmer vous-même.", "Tous les frais sont des champs modifiables. Si Etsy change un taux, ou si votre compte diffère, saisissez le nouveau chiffre et mettez la date à jour. L'application n'écrase jamais ce que vous saisissez.", "Indiquez votre taux horaire selon la valeur de votre temps. Il sert à transformer les heures saisies sur chaque produit en coût réel. Si vous préférez ne pas compter la main-d'œuvre, laissez zéro."]], ["Comprendre chaque frais", ["Frais de mise en vente. Un montant fixe qu'Etsy facture à la publication d'une fiche, à son renouvellement tous les quatre mois, et de nouveau à chaque vente d'une fiche multi-quantités. L'application en compte un par commande.", "Frais de transaction. Un pourcentage du prix plus la livraison que vous facturez plus l'emballage cadeau. C'est le frais le plus important pour la plupart des vendeurs.", "Traitement du paiement. Un pourcentage du total de la commande plus un montant fixe par commande. Les deux parties changent selon le pays, d'où l'importance du profil.", "Frais d'exploitation réglementaires. Un pourcentage payé par certains pays sur le prix plus la livraison. Ils ne sont pas facturés aux vendeurs des États-Unis ni d'Allemagne. Ils ont changé en juin 2026 pour plusieurs pays, vérifiez donc le vôtre.", "Conversion de devise. Deux et demi pour cent, facturés uniquement lorsque la devise de votre fiche diffère de celle de votre compte de versement. Cochez la case seulement si c'est votre cas.", "Offsite Ads. Quand Etsy fait la publicité de votre produit en dehors d'Etsy et que cette publicité génère la vente, Etsy prélève un pourcentage de la commande entière, livraison comprise. Quinze pour cent si votre boutique a réalisé moins de dix mille dollars l'an dernier, douze pour cent au-dessus, seuil à partir duquel cela devient obligatoire. Il existe un plafond par commande. Comme cela s'applique à la commande entière et non au seul prix, la marge est plus entamée que le pourcentage ne le laisse croire.", "Etsy Ads. Ce sont les publicités à l'intérieur d'Etsy, facturées au clic, il n'y a donc pas de pourcentage unique. Divisez ce que vous avez dépensé dans le mois par les commandes obtenues et saisissez cette moyenne.", "TVA sur les frais. Si vous vendez depuis l'Union européenne ou le Royaume-Uni et n'avez pas communiqué de numéro de TVA à Etsy, Etsy ajoute la TVA sur ses propres frais. Cochez la case et indiquez votre taux. Ce n'est pas la TVA payée par votre acheteur.", "Où tout vérifier : Gestionnaire de boutique, puis Finances, puis Frais. Etsy prévient aussi les vendeurs par courriel avant l'entrée en vigueur d'un changement."]], ["Ajouter vos produits", ["La section 2 contient une fiche par produit. Ajoutez-en autant que vous voulez ; l'application a été testée avec cent cinquante sans ralentissement.", "Prix facturé et Livraison facturée correspondent à ce que paie l'acheteur. Il n'y a pas de champ remise ici : indiquez le prix auquel vous vendez réellement.", "Viennent ensuite vos coûts. Matériaux ou coût du produit. Heures de travail, multipliées par votre taux horaire. Emballage. La livraison que vous payez réellement, souvent différente de celle que vous facturez. Coût d'impression à la demande, pour Printify, Printful ou équivalent. Et frais généraux par unité pour les outils, abonnements et tout ce que vous voulez répartir sur vos ventes.", "Cochez Produit numérique et les champs de livraison, d'emballage et d'impression à la demande disparaissent et comptent pour zéro. À utiliser pour les téléchargements, modèles et fichiers.", "La bande colorée au bas de chaque fiche est le résumé. Vert signifie une marge de vingt-cinq pour cent ou plus. Orange, entre dix et vingt-cinq. Rouge, en dessous de dix pour cent, ou une perte. Ouvrez Détail des frais et des coûts pour voir chaque ligne à l'origine du chiffre.", "Votre marge, c'est le bénéfice divisé par le prix. Ce n'est pas la même chose que la marge sur coût, et c'est elle qui vous dit si un produit vaut la peine."]], ["Le trouveur de prix", ["La section 3 fonctionne à l'envers. Au lieu de demander combien vous gagnez à un prix donné, elle demande quel prix vous donne le gain souhaité.", "Choisissez un produit, puis un objectif. Bénéfice par vente demande un montant. Marge demande un pourcentage du prix. Saisissez l'objectif et l'application vous donne le prix nécessaire, le bénéfice à ce prix et la marge obtenue.", "L'objectif de bénéfice mensuel en fait un plan : combien de ventes de ce produit il vous faut chaque mois pour l'atteindre.", "Si l'objectif est inatteignable, tout affiche un tiret et un message explique pourquoi. Cela signifie en général que les coûts du produit le rendent impossible à tout prix raisonnable.", "La note en dessous compare le résultat à votre prix actuel et suggère le prix le plus proche finissant par neuf, car c'est celui qui convertit le mieux sur le marché américain."]], ["Sauvegardes, exports et impression", ["Exporter une sauvegarde enregistre tout, réglages de la boutique et produits, dans un petit fichier. Conservez-le en lieu sûr. Importer une sauvegarde le restaure, sur cet ordinateur ou un autre.", "Faites-le avant d'effacer les données du navigateur, de changer d'ordinateur, de navigateur ou de réinstaller quoi que ce soit. L'application stocke ses données dans le navigateur, et les navigateurs oublient.", "Exporter en CSV écrit votre liste de produits dans un fichier tableur avec prix, chiffre d'affaires, frais, coûts, bénéfice et marge. Le séparateur et la virgule décimale suivent la langue sélectionnée, le fichier s'ouvre donc correctement dans Excel dans votre pays.", "Imprimer ou PDF produit une page propre sans boutons, utile pour votre comptable ou pour vos archives."]], ["Un exemple chiffré", ["Supposons que vous vendiez une bougie artisanale depuis l'Espagne à vingt-cinq euros avec quatre euros de livraison facturée, et que la vente soit organique et non issue d'Offsite Ads.", "Etsy prélève : les frais de mise en vente de dix-huit centimes ; les frais de transaction de six virgule cinq pour cent sur vingt-neuf euros, soit un euro quatre-vingt-neuf ; le traitement du paiement de quatre pour cent plus trente centimes, soit un euro quarante-six ; et les frais réglementaires de zéro virgule quatre-vingt-huit pour cent, vingt-six centimes. Total des frais : trois euros soixante-dix-neuf.", "Vos coûts sont, disons, six euros de cire et de verre, une demi-heure de travail à quinze euros de l'heure soit sept euros cinquante, un euro d'emballage et trois euros cinquante d'affranchissement réellement payé. Total des coûts : dix-huit euros.", "Vous recevez vingt-neuf moins trois soixante-dix-neuf, soit vingt-cinq euros vingt et un. Retirez dix-huit euros de coûts et votre bénéfice est de sept euros vingt et un, une marge de vingt-huit virgule huit pour cent. La fiche s'affiche en vert.", "Passez maintenant Offsite Ads à quinze pour cent. Etsy prélève quatre euros trente-cinq de plus et votre bénéfice tombe à deux euros quatre-vingt-six, une marge de onze pour cent. La fiche passe en orange. Voilà la différence que fait un seul réglage, et pourquoi il vaut la peine de le simuler."]], ["Questions et problèmes", ["Les chiffres ne correspondent pas à mon relevé Etsy. Vérifiez trois choses. D'abord, que les taux de la section 1 correspondent à votre Gestionnaire de boutique aujourd'hui. Ensuite, qu'Offsite Ads est réglé comme la vente s'est réellement produite. Enfin, que la TVA sur les frais correspond au fait d'avoir ou non communiqué un numéro de TVA à Etsy.", "J'ai saisi une virgule et le résultat est étrange. L'application accepte la virgule comme le point en séparateur décimal, ainsi que les séparateurs de milliers européens et anglais. Si un champ devient rouge, cela signifie que ce que vous avez saisi n'est pas un nombre et qu'il compte pour zéro.", "Mes données ont disparu. L'application stocke les données dans le navigateur. Navigation privée, effacement des données du site, autre navigateur ou autre ordinateur signifient repartir de zéro. C'est à cela que sert Exporter une sauvegarde.", "L'affichage est mauvais sur mon téléphone. L'application fonctionne sur téléphone, mais le tableau des frais défile horizontalement dans son propre cadre. Tournez le téléphone pour cette partie.", "Mon navigateur propose de traduire la page. Refusez. L'application a déjà ses cinq langues et une traduction automatique les écraserait.", "Quelque chose ne fonctionne pas. Écrivez-moi via Etsy avant de laisser un avis. Le support et les mises à jour mineures sont inclus pendant trente jours, et je réponds en moins d'une journée."]], ["Une fois par an, vérifiez ceci", ["Si Etsy a modifié un frais, et mettez à jour les chiffres et la date dans la section 1.", "Si votre boutique a dépassé dix mille dollars sur les douze derniers mois, car Offsite Ads devient alors obligatoire à douze pour cent.", "Si votre taux horaire reflète toujours la valeur de votre temps.", "Si vos coûts de matériaux ont augmenté, car un produit vert il y a un an peut être orange aujourd'hui.", "Et profitez-en pour exporter une nouvelle sauvegarde."]]], "de": [["Was diese Anwendung macht", ["Sie berechnet, was Etsy bei jedem Verkauf wirklich einbehält, was dir bleibt, und welchen Preis du verlangen solltest, um das zu verdienen, was du willst. Es ist eine einzige Datei, die im Browser läuft, ohne Konto, ohne Abo und ohne Internetverbindung.", "Sie ist nicht mit deinem Etsy-Shop verbunden. Du gibst Preise und Kosten ein; die Anwendung rechnet mit den Gebühren, die du bestätigst. Das ist Absicht: nichts, was du eingibst, verlässt jemals deinen Computer.", "Alles wird automatisch in diesem Browser gespeichert. Wenn du Browserdaten löschst oder den Computer wechselst, nutze Sicherung exportieren und Sicherung importieren."]], ["Deinen Shop einrichten", ["Öffne Abschnitt 1 und wähle dein Verkäuferland. Damit wird ein Gebührenprofil geladen: Währungssymbol, Einstellgebühr, Transaktionsprozentsatz, Zahlungsabwicklung und, wo zutreffend, die regulatorische Betriebsgebühr.", "Neben der regulatorischen Gebühr steht ein kleines Etikett. Geprüft mit einem Datum bedeutet, dass diese Zahlen an jenem Tag anhand der Hilfeseiten von Etsy kontrolliert wurden. Im Shop-Manager prüfen bedeutet, dass das Profil ein sinnvoller Ausgangspunkt ist, du es aber selbst bestätigen solltest.", "Jede Gebühr ist ein editierbares Feld. Ändert Etsy einen Satz oder weicht dein Konto ab, trage die neue Zahl ein und aktualisiere das Datum. Die Anwendung überschreibt niemals, was du eingibst.", "Setze deinen Stundensatz auf den Wert deiner Zeit. Er wandelt die Arbeitsstunden, die du je Produkt einträgst, in echte Kosten um. Wenn du Arbeitszeit nicht rechnen willst, lass ihn auf null."]], ["Jede Gebühr verstehen", ["Einstellgebühr. Ein fester Betrag, den Etsy beim Einstellen eines Angebots berechnet, bei der Verlängerung nach vier Monaten, und erneut bei jedem Verkauf eines Angebots mit mehreren Stück. Die Anwendung rechnet eine pro Bestellung.", "Transaktionsgebühr. Ein Prozentsatz auf den Preis plus den von dir berechneten Versand plus Geschenkverpackung. Für die meisten Verkäufer ist das die größte Einzelgebühr.", "Zahlungsabwicklung. Ein Prozentsatz der Bestellsumme plus ein fester Betrag pro Bestellung. Beide Teile ändern sich je nach Land, deshalb ist das Profil wichtig.", "Regulatorische Betriebsgebühr. Ein Prozentsatz, den einige Länder auf Preis plus Versand zahlen. Verkäufern in den Vereinigten Staaten und in Deutschland wird sie nicht berechnet. Sie hat sich im Juni 2026 für mehrere Länder geändert, prüfe also deine.", "Währungsumrechnung. Zweieinhalb Prozent, nur berechnet, wenn die Währung deines Angebots von der deines Auszahlungskontos abweicht. Setze das Häkchen nur, wenn das auf dich zutrifft.", "Offsite Ads. Wenn Etsy dein Produkt außerhalb von Etsy bewirbt und diese Anzeige den Verkauf auslöst, berechnet Etsy einen Prozentsatz der gesamten Bestellung, Versand inbegriffen. Fünfzehn Prozent, wenn dein Shop im letzten Jahr weniger als zehntausend Dollar umgesetzt hat, zwölf Prozent darüber, wo es zugleich verpflichtend wird. Es gibt eine Obergrenze pro Bestellung. Da es für die ganze Bestellung gilt und nicht nur für den Preis, drückt es die Marge stärker, als der genannte Prozentsatz vermuten lässt.", "Etsy Ads. Das sind die Anzeigen innerhalb von Etsy, abgerechnet pro Klick, es gibt also keinen einheitlichen Prozentsatz. Teile deine Ausgaben eines Monats durch die dadurch erzielten Bestellungen und trage diesen Durchschnitt ein.", "Umsatzsteuer auf Gebühren. Wenn du aus der Europäischen Union oder dem Vereinigten Königreich verkaufst und Etsy keine Umsatzsteuer-Identifikationsnummer gegeben hast, schlägt Etsy Umsatzsteuer auf seine eigenen Gebühren auf. Setze das Häkchen und trage deinen Satz ein. Das ist nicht die Umsatzsteuer, die dein Käufer zahlt.", "Wo du alles prüfst: Shop-Manager, dann Finanzen, dann Gebühren. Etsy informiert Verkäufer außerdem per E-Mail, bevor eine Änderung in Kraft tritt."]], ["Deine Produkte anlegen", ["Abschnitt 2 enthält eine Karte pro Produkt. Lege so viele an, wie du möchtest; die Anwendung wurde mit hundertfünfzig ohne Verlangsamung getestet.", "Dein Verkaufspreis und Berechneter Versand sind das, was der Käufer zahlt. Ein Rabattfeld gibt es hier nicht: trage den Preis ein, zu dem du tatsächlich verkaufst.", "Dann kommen deine Kosten. Material oder Wareneinsatz. Arbeitsstunden, multipliziert mit deinem Stundensatz. Verpackung. Der Versand, den du tatsächlich zahlst und der oft von dem abweicht, den du berechnest. Print-on-Demand-Kosten für Printify, Printful oder ähnliche. Und Gemeinkosten pro Stück für Werkzeuge, Abos und alles, was du auf deine Verkäufe umlegen willst.", "Setze das Häkchen bei Digitales Produkt und die Felder für Versand, Verpackung und Print-on-Demand verschwinden und zählen als null. Nutze es für Downloads, Vorlagen und Dateien.", "Der farbige Streifen am Fuß jeder Karte ist die Zusammenfassung. Grün bedeutet eine Marge von fünfundzwanzig Prozent oder mehr. Gelb zwischen zehn und fünfundzwanzig. Rot unter zehn Prozent oder Verlust. Öffne Aufschlüsselung von Gebühren und Kosten, um jede Zeile zu sehen, die zu der Zahl geführt hat.", "Deine Marge ist Gewinn geteilt durch Preis. Das ist nicht dasselbe wie der Aufschlag auf die Kosten, und sie sagt dir, ob ein Produkt sich lohnt."]], ["Der Preisfinder", ["Abschnitt 3 rechnet rückwärts. Statt zu fragen, was du bei einem Preis verdienst, fragt er, welcher Preis dir den gewünschten Verdienst bringt.", "Wähle ein Produkt und ein Ziel. Gewinn pro Verkauf verlangt einen Geldbetrag. Marge verlangt einen Prozentsatz des Preises. Trage das Ziel ein und die Anwendung nennt dir den nötigen Preis, den Gewinn bei diesem Preis und die sich ergebende Marge.", "Das monatliche Gewinnziel macht daraus einen Plan: wie viele Verkäufe dieses Produkts du pro Monat brauchst, um es zu erreichen.", "Ist das Ziel nicht erreichbar, zeigt alles einen Strich und eine Meldung erklärt warum. Das bedeutet meist, dass die Kosten des Produkts es zu keinem vernünftigen Preis möglich machen.", "Der Hinweis darunter vergleicht das Ergebnis mit deinem aktuellen Preis und schlägt den nächstgelegenen Preis vor, der auf neun endet, weil dieser auf dem US-Markt am besten verkauft."]], ["Sicherungen, Exporte und Drucken", ["Sicherung exportieren speichert alles, Shop-Einstellungen und Produkte, in einer kleinen Datei. Bewahre sie sicher auf. Sicherung importieren stellt sie wieder her, auf diesem oder einem anderen Computer.", "Mach das, bevor du Browserdaten löschst, den Computer wechselst, den Browser wechselst oder irgendetwas neu installierst. Die Anwendung speichert ihre Daten im Browser, und Browser vergessen.", "CSV exportieren schreibt deine Produktliste in eine Tabellendatei mit Preis, Umsatz, Gebühren, Kosten, Gewinn und Marge. Trennzeichen und Dezimalzeichen richten sich nach der gewählten Sprache, damit die Datei in Excel in deinem Land korrekt öffnet.", "Drucken oder PDF erzeugt eine saubere Seite ohne Schaltflächen, nützlich für deine Steuerberatung oder für deine Unterlagen."]], ["Ein durchgerechnetes Beispiel", ["Angenommen, du verkaufst eine handgemachte Kerze aus Spanien für fünfundzwanzig Euro mit vier Euro berechnetem Versand, und der Verkauf ist organisch und stammt nicht aus Offsite Ads.", "Etsy nimmt: die Einstellgebühr von achtzehn Cent; die Transaktionsgebühr von sechs Komma fünf Prozent auf neunundzwanzig Euro, also ein Euro neunundachtzig; die Zahlungsabwicklung von vier Prozent plus dreißig Cent, also ein Euro sechsundvierzig; und die regulatorische Gebühr von null Komma achtundachtzig Prozent, sechsundzwanzig Cent. Gebühren insgesamt: drei Euro neunundsiebzig.", "Deine Kosten sind, sagen wir, sechs Euro für Wachs und Glas, eine halbe Stunde Arbeit zu fünfzehn Euro die Stunde, also sieben Euro fünfzig, ein Euro Verpackung und drei Euro fünfzig tatsächlich gezahltes Porto. Kosten insgesamt: achtzehn Euro.", "Du erhältst neunundzwanzig minus drei neunundsiebzig, also fünfundzwanzig Euro einundzwanzig. Ziehe achtzehn Euro Kosten ab und dein Gewinn beträgt sieben Euro einundzwanzig, eine Marge von achtundzwanzig Komma acht Prozent. Die Karte zeigt grün.", "Stelle nun Offsite Ads auf fünfzehn Prozent. Etsy nimmt vier Euro fünfunddreißig mehr und dein Gewinn fällt auf zwei Euro sechsundachtzig, eine Marge von elf Prozent. Die Karte wird gelb. Das ist der Unterschied, den eine einzige Einstellung macht, und deshalb lohnt es sich, das durchzuspielen."]], ["Fragen und Probleme", ["Die Zahlen stimmen nicht mit meiner Etsy-Abrechnung überein. Prüfe drei Dinge. Erstens, ob die Sätze in Abschnitt 1 heute mit deinem Shop-Manager übereinstimmen. Zweitens, ob Offsite Ads so eingestellt ist, wie der Verkauf tatsächlich zustande kam. Drittens, ob die Umsatzsteuer auf Gebühren dazu passt, ob du Etsy eine Umsatzsteuer-Identifikationsnummer gegeben hast.", "Ich habe ein Komma eingegeben und etwas Seltsames passierte. Die Anwendung akzeptiert Komma und Punkt als Dezimalzeichen sowie europäische und englische Tausendertrennzeichen. Wird ein Feld rot, ist die Eingabe keine Zahl und wird als null gewertet.", "Meine Daten sind verschwunden. Die Anwendung speichert Daten im Browser. Privates Surfen, gelöschte Websitedaten, ein anderer Browser oder ein anderer Computer bedeuten einen Neuanfang. Genau dafür gibt es Sicherung exportieren.", "Auf dem Handy sieht es falsch aus. Die Anwendung funktioniert auf dem Handy, aber die Gebührentabelle scrollt seitlich in ihrem eigenen Rahmen. Drehe das Handy für diesen Teil.", "Mein Browser bietet an, die Seite zu übersetzen. Lehne ab. Die Anwendung hat bereits ihre fünf Sprachen und eine automatische Übersetzung würde sie überschreiben.", "Etwas funktioniert nicht. Schreib mir über Etsy, bevor du eine Bewertung hinterlässt. Support und kleinere Updates sind dreißig Tage inbegriffen, und ich antworte innerhalb eines Tages."]], ["Einmal im Jahr prüfen", ["Ob Etsy eine Gebühr geändert hat, und aktualisiere Zahlen und Datum in Abschnitt 1.", "Ob dein Shop in den letzten zwölf Monaten zehntausend Dollar überschritten hat, denn dann wird Offsite Ads bei zwölf Prozent verpflichtend.", "Ob dein Stundensatz noch dem Wert deiner Zeit entspricht.", "Ob deine Materialkosten gestiegen sind, denn ein Produkt, das vor einem Jahr grün war, kann heute gelb sein.", "Und exportiere bei der Gelegenheit gleich eine neue Sicherung."]]], "it": [["Che cosa fa questa applicazione", ["Calcola quanto Etsy trattiene davvero su ogni vendita, quanto resta a te, e che prezzo dovresti chiedere per guadagnare quello che vuoi. È un unico file che funziona nel browser, senza account, senza abbonamento e senza connessione a internet.", "Non è collegata al tuo negozio Etsy. Tu inserisci prezzi e costi; l'applicazione fa i conti con le commissioni che confermi tu. È voluto: nulla di ciò che scrivi lascia mai il tuo computer.", "Tutto viene salvato automaticamente in questo browser. Se cancelli i dati del browser o cambi computer, usa Esporta backup e Importa backup."]], ["Configurare il tuo negozio", ["Apri la sezione 1 e scegli il tuo paese di venditore. Questo carica un profilo di commissioni: simbolo della valuta, commissione di inserzione, percentuale di transazione, elaborazione del pagamento e, dove si applica, la commissione operativa regolatoria.", "Accanto alla commissione regolatoria trovi una piccola etichetta. Verificato con una data significa che quei numeri sono stati controllati sulle pagine di aiuto di Etsy quel giorno. Verifica nel Gestore significa che il profilo è un punto di partenza ragionevole ma dovresti confermarlo tu.", "Ogni commissione è una casella modificabile. Se Etsy cambia una percentuale, o il tuo account è diverso, scrivi il nuovo numero e aggiorna la data. L'applicazione non sovrascrive mai quello che scrivi tu.", "Imposta la tua tariffa oraria in base a quanto vale il tuo tempo. Serve a trasformare le ore che indichi su ogni prodotto in un costo reale. Se preferisci non contare la manodopera, lasciala a zero."]], ["Capire ogni commissione", ["Commissione di inserzione. Un importo fisso che Etsy addebita quando pubblichi un'inserzione, quando si rinnova dopo quattro mesi, e di nuovo ogni volta che si vende un'inserzione con più quantità. L'applicazione ne conta una per ordine.", "Commissione di transazione. Una percentuale sul prezzo più la spedizione che addebiti più la confezione regalo. Per la maggior parte dei venditori è la commissione più alta.", "Elaborazione del pagamento. Una percentuale del totale dell'ordine più un importo fisso per ordine. Entrambe le parti cambiano in base al paese, ed è per questo che il profilo conta.", "Commissione operativa regolatoria. Una percentuale che pagano alcuni paesi su prezzo più spedizione. Non viene addebitata ai venditori degli Stati Uniti né della Germania. È cambiata a giugno 2026 per diversi paesi, quindi verifica la tua.", "Conversione di valuta. Due e mezzo per cento, addebitato solo quando la valuta della tua inserzione è diversa da quella del tuo conto di pagamento. Spunta la casella solo se è il tuo caso.", "Offsite Ads. Quando Etsy pubblicizza il tuo prodotto fuori da Etsy e quella pubblicità genera la vendita, Etsy trattiene una percentuale dell'intero ordine, spedizione inclusa. Quindici per cento se il tuo negozio ha fatturato meno di diecimila dollari nell'ultimo anno, dodici per cento sopra tale soglia, dove diventa anche obbligatorio. Esiste un tetto per ordine. Poiché si applica all'intero ordine e non solo al prezzo, riduce il margine più di quanto suggerisca la percentuale.", "Etsy Ads. Sono le pubblicità dentro Etsy e si pagano a clic, quindi non c'è una percentuale unica. Dividi quanto hai speso in un mese per gli ordini ottenuti e inserisci quella media.", "IVA sulle commissioni. Se vendi dall'Unione Europea o dal Regno Unito e non hai dato a Etsy una partita IVA, Etsy aggiunge l'IVA sulle proprie commissioni. Spunta la casella e imposta la tua aliquota. Non è l'IVA che paga il tuo acquirente.", "Dove verificarle tutte: Gestore negozio, poi Finanze, poi Commissioni. Etsy avvisa anche i venditori via email prima che una modifica entri in vigore."]], ["Aggiungere i tuoi prodotti", ["La sezione 2 contiene una scheda per prodotto. Aggiungine quanti vuoi; l'applicazione è stata testata con centocinquanta senza rallentamenti.", "Prezzo che fai pagare e Spedizione che fai pagare sono quello che paga l'acquirente. Qui non c'è un campo sconto: inserisci il prezzo a cui vendi davvero.", "Poi vengono i tuoi costi. Materiali o costo del prodotto. Ore di lavoro, moltiplicate per la tua tariffa oraria. Imballaggio. La spedizione che paghi davvero, spesso diversa da quella che addebiti. Costo print-on-demand, per Printify, Printful o simili. E spese generali per unità, per strumenti, abbonamenti e tutto ciò che vuoi ripartire sulle vendite.", "Spunta Prodotto digitale e i campi di spedizione, imballaggio e print-on-demand spariscono e contano come zero. Usalo per download, modelli e file.", "La banda colorata in fondo a ogni scheda è il riepilogo. Verde significa un margine del venticinque per cento o più. Ambra, tra dieci e venticinque. Rosso, sotto il dieci per cento oppure una perdita. Apri Dettaglio di commissioni e costi per vedere ogni riga che ha prodotto quel numero.", "Il tuo margine è il profitto diviso per il prezzo. Non è la stessa cosa del ricarico sul costo, ed è ciò che ti dice se un prodotto vale la pena."]], ["Il trova prezzo", ["La sezione 3 funziona al contrario. Invece di chiedere quanto guadagni a un certo prezzo, chiede quale prezzo ti dà il guadagno che vuoi.", "Scegli un prodotto e un obiettivo. Profitto per vendita chiede una somma di denaro. Margine chiede una percentuale del prezzo. Scrivi l'obiettivo e l'applicazione ti dà il prezzo necessario, il profitto a quel prezzo e il margine che ne risulta.", "L'obiettivo di profitto mensile lo trasforma in un piano: quante vendite di quel prodotto ti servono ogni mese per raggiungerlo.", "Se l'obiettivo non è raggiungibile, tutto mostra un trattino e un messaggio spiega perché. Di solito significa che i costi del prodotto lo rendono impossibile a qualsiasi prezzo ragionevole.", "La nota sotto confronta il risultato con il tuo prezzo attuale e suggerisce il prezzo più vicino che finisce per nove, perché è quello che converte meglio sul mercato statunitense."]], ["Backup, esportazioni e stampa", ["Esporta backup salva tutto, impostazioni del negozio e prodotti, in un piccolo file. Conservalo al sicuro. Importa backup lo ripristina, su questo computer o su un altro.", "Fallo prima di cancellare i dati del browser, cambiare computer, cambiare browser o reinstallare qualsiasi cosa. L'applicazione salva i dati dentro il browser, e i browser dimenticano.", "Esporta CSV scrive la tua lista di prodotti in un file di foglio di calcolo con prezzo, ricavi, commissioni, costi, profitto e margine. Il separatore e la virgola decimale seguono la lingua selezionata, così si apre correttamente in Excel nel tuo paese.", "Stampa o PDF produce una pagina pulita senza pulsanti, utile per il commercialista o per il tuo archivio."]], ["Un esempio svolto", ["Supponiamo che tu venda una candela artigianale dalla Spagna a venticinque euro con quattro euro di spedizione addebitata, e che la vendita sia organica e non provenga da Offsite Ads.", "Etsy trattiene: la commissione di inserzione di diciotto centesimi; quella di transazione, sei virgola cinque per cento su ventinove euro, cioè un euro e ottantanove; l'elaborazione del pagamento, quattro per cento più trenta centesimi, cioè un euro e quarantasei; e la commissione regolatoria dello zero virgola ottantotto per cento, ventisei centesimi. Totale commissioni: tre euro e settantanove.", "I tuoi costi sono, diciamo, sei euro di cera e vetro, mezz'ora di lavoro a quindici euro l'ora cioè sette euro e cinquanta, un euro di imballaggio e tre euro e cinquanta di affrancatura che paghi davvero. Totale costi: diciotto euro.", "Ricevi ventinove meno tre e settantanove, cioè venticinque euro e ventuno. Togli diciotto euro di costi e il tuo profitto è di sette euro e ventuno, un margine del ventotto virgola otto per cento. La scheda si mostra verde.", "Ora imposta Offsite Ads al quindici per cento. Etsy trattiene quattro euro e trentacinque in più e il tuo profitto scende a due euro e ottantasei, un margine dell'undici per cento. La scheda diventa ambra. È la differenza che fa una singola impostazione, ed è per questo che vale la pena simularla."]], ["Domande e problemi", ["I numeri non corrispondono al mio estratto conto Etsy. Controlla tre cose. Primo, che le commissioni della sezione 1 corrispondano al tuo Gestore negozio oggi. Secondo, che Offsite Ads sia impostato come è realmente avvenuta quella vendita. Terzo, che l'IVA sulle commissioni corrisponda al fatto di aver dato o meno una partita IVA a Etsy.", "Ho scritto una virgola e ha fatto qualcosa di strano. L'applicazione accetta la virgola e il punto come separatore decimale, e i separatori delle migliaia europei e inglesi. Se una casella diventa rossa significa che quello che hai scritto non è un numero e viene contato come zero.", "I miei dati sono spariti. L'applicazione salva i dati dentro il browser. Navigazione privata, cancellazione dei dati del sito, un altro browser o un altro computer significano ricominciare da capo. È per questo che esiste Esporta backup.", "Si vede male sul telefono. L'applicazione funziona sul telefono, ma la tabella delle commissioni scorre in orizzontale dentro la propria cornice. Gira il telefono per quella parte.", "Il browser mi propone di tradurre la pagina. Rifiuta. L'applicazione ha già le sue cinque lingue e una traduzione automatica le sovrascriverebbe.", "Qualcosa non funziona. Scrivimi tramite Etsy prima di lasciare una recensione. Il supporto e gli aggiornamenti minori sono inclusi per trenta giorni, e rispondo entro un giorno."]], ["Una volta all'anno, controlla questo", ["Se Etsy ha cambiato qualche commissione, e aggiorna i numeri e la data nella sezione 1.", "Se il tuo negozio ha superato i diecimila dollari negli ultimi dodici mesi, perché allora Offsite Ads diventa obbligatorio al dodici per cento.", "Se la tua tariffa oraria riflette ancora quanto vale il tuo tempo.", "Se sono aumentati i costi dei materiali, perché un prodotto che un anno fa era verde oggi può essere ambra.", "E approfittane per esportare un backup nuovo."]]]};
const KEY = 'etsyFeeCalc.v1';
const $ = id => document.getElementById(id);
const n = v => { if(typeof v==='number') return isFinite(v)?v:0; let s=String(v==null?'':v).trim().replace(/\s/g,'').replace(/[^\d.,\-]/g,''); if(!s) return 0;
  if(s.includes(',')&&s.includes('.')){ if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(s.includes(',')){ s=s.replace(/,/g,'.'); }
  if((s.match(/\./g)||[]).length>1){ const i=s.lastIndexOf('.'); s=s.slice(0,i).replace(/\./g,'')+s.slice(i); }
  const x=parseFloat(s); return isFinite(x)?x:0; };
const looksNumeric = v => v==null || String(v).trim()==='' || /^[\s\d.,\-+€$£¥%]*$/.test(String(v));
function readNum(el, allowNeg){ const raw=el.value; const ok=looksNumeric(raw); el.classList.toggle('bad', !ok); let x=n(raw); if(!allowNeg&&x<0) x=0; return x; }
let L = I18N.en;
const t = (k, vars) => { let s = (L[k] !== undefined ? L[k] : I18N.en[k]); if (vars) for (const v in vars) s = s.split('{'+v+'}').join(vars[v]); return s; };

  lang:'', country:'US', cur:'$', feeDate:VERIFIED, hourly:15,

function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); if(Array.isArray(o.products)) o.products=o.products.map(x=>Object.assign(defaultProduct(),x)); S=Object.assign(S,o); } }catch(e){} if(!S.lang) S.lang=detectLang(); L=I18N[S.lang]||I18N.en; if(!S.products.length){ const p=defaultProduct(); p.name=t('example'); S.products.push(p);} }

function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._h); el._h=setTimeout(()=>el.classList.remove('show'),1800); }
const LOC={en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',it:'it-IT'};
const fmt=(v,d)=>{ try{ return new Intl.NumberFormat(LOC[S.lang]||'en-US',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v); }catch(e){ return v.toFixed(d); } };
const money = v => { const neg=v<-0.004; const s=fmt(Math.abs(Math.round(v*100)/100),2); return (neg?'−':'')+(S.lang==='en'?S.cur+s:s+'\u00a0'+S.cur); };
const pct = v => fmt(Math.round(v*10)/10,1)+(S.lang==='en'?'%':'\u00a0%');

// ---- core calculation ----
function fees(price, ship){
  const total = price + ship; const f = {};
  f.listing = S.listing; f.trans = total * S.trans/100; f.proc = total * S.proc/100 + S.procfix; f.reg = total * S.reg/100;
  f.conv = S.convOn ? total * S.conv/100 : 0;
  f.offsite = S.offsite==='none' ? 0 : Math.min(total * n(S.offsite)/100, S.offcap);
  f.etsyads = S.etsyads;
  const sub = f.listing+f.trans+f.proc+f.reg+f.conv+f.offsite+f.etsyads;
  f.vat = S.vatOn ? sub * S.vat/100 : 0; f.total = sub + f.vat; return f;
}
function costs(p){ const d=!!p.digital; const c = {mat:p.mat, labor:p.hours*S.hourly, pack:d?0:p.pack, shipcost:d?0:p.shipcost, pod:d?0:p.pod, over:p.over}; c.total = c.mat+c.labor+c.pack+c.shipcost+c.pod+c.over; return c; }
function calc(p, priceOverride){
  const price = priceOverride!==undefined ? priceOverride : p.price;
  const ship = p.digital?0:p.ship; const f = fees(price, ship), c = costs(p); const revenue = price + ship;
  const profit = revenue - f.total - c.total; const margin = price>0 ? profit/price*100 : 0;
  return {price, revenue, f, c, profit, margin};
}
function priceFor(p, mode, target){
  let lo=0, hi=10000;
  for(let i=0;i<60;i++){ const mid=(lo+hi)/2, r=calc(p, mid); const ok = mode==='amount' ? r.profit>=target : r.margin>=target; if(ok) hi=mid; else lo=mid; }
  return Math.ceil(hi*100)/100;
}
function badge(m, profit){ if(profit<0||m<10) return 'bad'; if(m<25) return 'warn'; return 'ok'; }

function renderShopTag(){ const v = PROFILES[S.country] && PROFILES[S.country].verified; const el=$('regTag'); el.textContent = v ? t('tagVerified')+' '+VERIFIED : t('tagCheck'); el.className = 'tag'+(v?'':' warn'); }

function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function productCard(p){
  const el=document.createElement('div'); el.className='product'; el.dataset.id=p.id;
  const phys={ship:1,pack:1,shipcost:1,pod:1};
  const f=(k,key)=>`<div${phys[k]?' data-phys':''}><label>${t(key)}</label><input type="text" inputmode="decimal" data-k="${k}" aria-label="${esc(t(key))}" value="${p[k]}"></div>`;
  if(p.digital) el.classList.add('digital');
  el.innerHTML = `
    <div class="top"><input type="text" data-k="name" placeholder="${esc(t('pName'))}" value="${esc(p.name)}"></div>
    <label class="digi"><input type="checkbox" data-k="digital" ${p.digital?'checked':''}>${t('pDigital')}</label>
    <div class="fields">${f('price','pPrice')}${f('ship','pShip')}${f('mat','pMat')}${f('hours','pHours')}${f('pack','pPack')}${f('shipcost','pShipCost')}${f('pod','pPod')}${f('over','pOver')}</div>
    <div class="result" data-r="box"><div><span data-r="profit"></span><small data-r="sub"></small></div><div data-r="margin"></div></div>
    <details><summary>${t('rBreak')}</summary><div class="breakdown" data-r="bd"></div></details>
    <div class="actions"><button data-a="dup">${t('bDup')}</button><button data-a="del" class="danger">${t('bDel')}</button></div>`;
  return el;

function renderProducts(){ const c=$('cards'); c.innerHTML=''; S.products.forEach(p=>c.appendChild(productCard(p))); updateAll(); }
function updateCard(el, p){
  const r=calc(p), b=badge(r.margin, r.profit);
  el.querySelector('[data-r=box]').className='result '+b;
  el.querySelector('[data-r=profit]').textContent = (r.profit<0?t('rLoss'):t('rProfit'))+' '+money(Math.abs(r.profit))+' '+t('rPerSale');
  el.querySelector('[data-r=sub]').textContent = t('rFees')+' '+money(r.f.total)+' · '+t('rCosts')+' '+money(r.c.total)+' · '+t('rReceive')+' '+money(r.revenue-r.f.total);
  el.querySelector('[data-r=margin]').textContent = pct(r.margin);
  const f=r.f, c=r.c, rows=[[t('bRevenue'), r.revenue],[t('bListing'), -f.listing],[t('bTrans')+' '+pct(S.trans), -f.trans],[t('bProc'), -f.proc]];
  if(f.reg) rows.push([t('bReg'), -f.reg]); if(f.conv) rows.push([t('bConv'), -f.conv]); if(f.offsite) rows.push([t('bOffsite'), -f.offsite]); if(f.etsyads) rows.push([t('bEtsyAds'), -f.etsyads]); if(f.vat) rows.push([t('bVat'), -f.vat]);
  rows.push([t('bMat'), -c.mat]); if(c.labor) rows.push([t('bLabor')+' ('+p.hours+' h × '+money(S.hourly)+')', -c.labor]);
  if(c.pack) rows.push([t('bPack'), -c.pack]); if(c.shipcost) rows.push([t('bShipCost'), -c.shipcost]); if(c.pod) rows.push([t('bPod'), -c.pod]); if(c.over) rows.push([t('bOver'), -c.over]);
  el.querySelector('[data-r=bd]').innerHTML = rows.map(x=>`<div><span>${esc(x[0])}</span><span>${x[1]<0?'−':''}${money(Math.abs(x[1]))}</span></div>`).join('') + `<div class="total"><span>${t('bProfit')}</span><span>${money(r.profit)}</span></div>`;
}
function updateAll(){ document.querySelectorAll('.product').forEach(el=>{ const p=S.products.find(x=>String(x.id)===el.dataset.id); if(p) updateCard(el,p); }); renderReverseOptions(); updateReverse(); save(); }
function renderReverseOptions(){ const s=$('rvProduct'); const cur=s.value; s.innerHTML=''; S.products.forEach((p,i)=>{ const o=document.createElement('option'); o.value=p.id; o.textContent=p.name||t('productN',{n:i+1}); s.appendChild(o); }); if([...s.options].some(o=>o.value===cur)) s.value=cur; }
function updateReverse(){
  const p=S.products.find(x=>String(x.id)===$('rvProduct').value); if(!p) return;
  const mode=$('rvMode').value, target=readNum($('rvTarget'),true), goal=readNum($('rvGoal'));
  const unreachable=()=>{ ['rvPrice','rvProfit','rvMargin','rvSales'].forEach(id=>$(id).textContent='–'); $('rvNote').textContent=t('nUnreach'); };
  if(mode==='margin' && target>=95){ unreachable(); return; }
  const price=priceFor(p, mode, target), r=calc(p, price);
  if(price>=9999 || (mode==='amount' ? r.profit<target-0.01 : r.margin<target-0.05)){ unreachable(); return; }
  $('rvPrice').textContent=money(price); $('rvProfit').textContent=money(r.profit); $('rvMargin').textContent=pct(r.margin);
  $('rvSales').textContent = r.profit>0 ? Math.ceil(goal/r.profit) : '–';
  $('rvNote').textContent = t('nCompare',{price:money(p.price), profit:money(calc(p).profit), nine:money(Math.max(price, Math.ceil(price)-0.01))});
}

const LANGTAG={en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',it:'it-IT'};
function stopSpeaking(){ if('speechSynthesis' in window){ try{ window.speechSynthesis.cancel(); }catch(e){} } const b=$('btnListen'); if(b) b.textContent=t('bListen'); }
function pickVoice(tag){ const vs=window.speechSynthesis.getVoices()||[]; const low=tag.toLowerCase();
  return vs.find(v=>v.lang&&v.lang.toLowerCase().replace('_','-')===low) || vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith(S.lang)) || null; }
// Cola de lectura: una frase por vez. Chrome corta las locuciones largas, por eso se encadenan.
let QUEUE=null;
function clearReading(){ document.querySelectorAll('.reading').forEach(e=>e.classList.remove('reading')); }
let PAUSED=false;
function updatePlayUI(){
  const playing=!!QUEUE; const speech=('speechSynthesis' in window);
  $('btnManListen').hidden = playing || !speech;
  $('btnManPause').hidden = !playing;
  $('btnManStop').hidden = !playing;
  const p=$('btnManPause'); p.textContent = PAUSED ? '\u25b6' : '\u23f8';
  const lbl = t(PAUSED ? 'mResume' : 'mPause'); p.setAttribute('aria-label', lbl); p.title = lbl;
  const st=$('btnManStop'); st.setAttribute('aria-label', t('mStopShort')); st.title = t('mStopShort');
}
function stopSpeaking(){ QUEUE=null; PAUSED=false;
  if('speechSynthesis' in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  clearReading(); const b=$('btnListen'); if(b) b.textContent=t('bListen');
  const n=$('manNow'); if(n){ n.textContent=''; n.classList.remove('on'); }
  updatePlayUI(); }
function pauseSpeaking(){
  if(!QUEUE) return;
  if(PAUSED){ // continuar
    const q=QUEUE, idx=Math.max(0,q.i-1); PAUSED=false; updatePlayUI();
    try{ window.speechSynthesis.resume(); }catch(e){}
    // Respaldo: si el navegador no reanuda, se relee desde la frase actual.
    // Los navegadores mantienen speaking=true mientras está en pausa, por eso se mira paused.
    setTimeout(()=>{ const ss=window.speechSynthesis;
      if(!PAUSED && QUEUE===q && (ss.paused || !ss.speaking)){
        const items=q.items.slice(idx), done=q.onDone; QUEUE=null; try{ ss.cancel(); }catch(e){} speakList(items, done); } }, 400);
  } else {

}
function speakList(items, onDone){
  if(!('speechSynthesis' in window)) return; const ss=window.speechSynthesis; ss.cancel();
  const q={i:0, items, onDone}; QUEUE=q; const tag=LANGTAG[S.lang]||'en-US'; const voice=pickVoice(tag);
  (function next(){
    if(QUEUE!==q || q.i>=q.items.length){ if(QUEUE===q){ QUEUE=null; clearReading(); if(onDone) onDone(); } return; }
    const it=q.items[q.i++]; clearReading();
    if(it.sec!==undefined){ const n=$('manNow'); if(n){ n.textContent=t('mNow')+it.sec; n.classList.add('on'); } }
    if(it.el){ it.el.classList.add('reading'); if(!S.manMin){ try{ it.el.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){} } }
    const u=new SpeechSynthesisUtterance(it.text); u.lang=tag; u.rate=0.95; if(voice) u.voice=voice;
    u.onend=next; u.onerror=next; ss.speak(u);
  })();
}
function speakGuide(){
  if(!('speechSynthesis' in window)) return;

function renderManual(){

function manualItems(from){
